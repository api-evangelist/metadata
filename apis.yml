aid: metadata
name: Metadata
description: >-
  Metadata (metadata.io) is a B2B marketing automation and demand-generation
  platform that uses AI agents to plan, execute, and optimize paid advertising
  campaigns across LinkedIn, Meta (Facebook and Instagram), Google Search and
  Display, Reddit, and Bing. Its core products are Metadata Campaigns (automated
  full-funnel paid campaign execution), Metadata Audiences with the patented
  MetaMatch B2B audience engine for precision targeting, and Metadata Insights
  for real-time, revenue-focused performance analytics. The platform connects to
  ad channels, CRMs (Salesforce, HubSpot), and marketing automation platforms
  (Marketo, Pardot) to run multivariate campaign testing at scale and optimize
  for pipeline and revenue rather than lead volume. Backed by 500 Global and
  Partech. Metadata publishes no public REST API. Its developer surface is
  MCP-native: the MetadataONE MCP server at mcp-server.metadata.io/mcp exposes
  141 documented tools across audiences, campaigns, creatives, offers, keywords,
  ad extensions, analytics and integrations, so an agent can build an audience,
  generate on-brand creative, assemble a campaign and launch real paid spend
  without a REST client or an SDK. Developer docs, a quickstart, an authentication
  and scopes reference and the full tool catalog are published at
  metadata.io/developers/.
